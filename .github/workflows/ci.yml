name: ci

on:
  push:
    branches: [main]
  pull_request:

# The job reads the repo and nothing else. A token that can write is a token a
# compromised dev dependency could use.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit: a tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Production build, which also runs the spec §7 bundle audit.
      - run: npm run build:prod
