<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Sheet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Text is filled from _locales at load (spec §10 rule 13); lang is set
         from the resolved UI language, so neither is hardcoded here. -->
    <main id="root">
      <h1 id="title" data-i18n="popupTitle"></h1>
      <p id="status" role="status" aria-live="polite" data-i18n="popupConnecting"></p>
      <p class="note" data-i18n="popupPhaseNote"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
